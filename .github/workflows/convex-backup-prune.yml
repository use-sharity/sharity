name: Convex Backup Prune

on:
  schedule:
    - cron: "0 17 * * 0" # 00:00 Da Lat (UTC+7) Sunday
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete backups older than 7 days
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          CUTOFF=$(date -d '7 days ago' --utc +%Y-%m-%dT%H:%M:%SZ)
          aws s3api list-objects-v2 \
            --bucket ${{ secrets.R2_BUCKET_NAME }} \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --query "Contents[?LastModified<='${CUTOFF}'].Key" \
            --output text | tr '\t' '\n' | while read KEY; do
              [ -z "$KEY" ] && continue
              aws s3 rm \
                s3://${{ secrets.R2_BUCKET_NAME }}/${KEY} \
                --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          done
