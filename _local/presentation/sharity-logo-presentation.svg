<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <mask id="ring-cutout">
      <rect width="200" height="200" fill="white"/>
      <circle cx="100" cy="100" r="56" fill="black"/>
    </mask>
  </defs>
  <!-- Four rounded squares with ring cutout — off-white/cream for dark bg -->
  <g mask="url(#ring-cutout)">
    <rect x="8" y="8" width="76" height="76" rx="16" ry="16" fill="#f0ece6" stroke="#ffffff" stroke-width="3"/>
    <rect x="116" y="8" width="76" height="76" rx="16" ry="16" fill="#f0ece6" stroke="#ffffff" stroke-width="3"/>
    <rect x="8" y="116" width="76" height="76" rx="16" ry="16" fill="#f0ece6" stroke="#ffffff" stroke-width="3"/>
    <rect x="116" y="116" width="76" height="76" rx="16" ry="16" fill="#f0ece6" stroke="#ffffff" stroke-width="3"/>
  </g>
  <!-- Inner circle — original sage green -->
  <circle cx="100" cy="100" r="36" fill="#8aafa8"/>
</svg>
